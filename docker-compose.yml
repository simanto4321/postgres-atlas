# One-command stack. By default Atlas serves the bundled snapshot (no live DB
# needed). Point ATLAS_DSN at the compose Postgres to switch to live mode.
#
#   docker compose up --build
#   open http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: commerce
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - dbdata:/var/lib/postgresql/data

  atlas:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      # Demo mode by default. Uncomment the next line for live introspection:
      # ATLAS_DSN: postgres://atlas:atlas@db:5432/commerce?sslmode=disable
      ATLAS_SNAPSHOT: /sample-report.json
      ATLAS_ADDR: ":8000"
      ATLAS_THRESHOLD_GB: "100"
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    depends_on:
      - atlas
    ports:
      - "8080:80"

volumes:
  dbdata:
